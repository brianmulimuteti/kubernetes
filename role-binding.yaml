apiVersion: rbac.authorization.k8s.io/v1
# This role binding allows 'adam' to read pods in the 'default' namespace by binding the 'pod-reader' role to him.
# The role 'pod-reader' must already exist in the 'default' namespace for this binding to work.
# You create a role and then create a role-binding to grant permissions to a user, group, or service account.
kind: RoleBinding
metadata:
  name: read-pods
  namespace: default
subjects:
# You can specify users, groups, or service accounts as subjects.
 - kind: User
   name: brian
   apiGroup: rbac.authorization.k8s.io
roleRef:
# The roleRef specifies the role that you want to bind to the subjects. It must be in the same namespace as the RoleBinding.
  kind: Role # can be Role or ClusterRole
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io

