apiVersion: v1
kind: Pod
metadata:
  name: mem-request
  namespace: mem-example
spec:
  containers:
  - name: memory-request-demo
    image: polinux/stress
    resources:
      requests:
        memory: "100Mi"
      limits:
        memory: "200Mi"
    command: ["stress"]
    args: ["--vm", "1", "--vm-bytes", "150M", "--vm-hang", "1"]