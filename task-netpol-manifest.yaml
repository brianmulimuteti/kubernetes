---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  labels:
    app: mysql
    role: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
      role: mysql
  template:
    metadata:
      labels:
        app: mysql
        role: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:latest
          env:
            - name: "MYSQL_USER"
              value: "mysql"
            - name: "MYSQL_PASSWORD"
              value: "mysql"
            - name: "MYSQL_DATABASE"
              value: "mydb"
            - name: "MYSQL_ROOT_PASSWORD"
              value: "mysql"
          ports:
            - name: http
              containerPort: 3306
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: db
  labels:
    app: mysql
    role: mysql
spec:
  type: NodePort
  selector:
    app: mysql
    role: mysql
  ports:
    - port: 3306
      # By default and for convenience, the `targetPort` is set to
      # the same value as the `port` field.
      targetPort: 3306
      # Optional field
      # By default and for convenience, the Kubernetes control plane
      # will allocate a port from a range (default: 30000-32767)
      nodePort: 30009