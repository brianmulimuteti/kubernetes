apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-deploy-backend-to-deploy-db
spec:
  podSelector:
    matchLabels:
      name: db-579c9898ff-5dzj5
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: backend
          role: backend
    ports:
    - protocol: TCP
      port: 3306
