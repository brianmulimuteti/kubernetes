apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: nginx-task
    tier: backend
  name: nginx-task
spec:
  replicas: 5
  selector:
    matchLabels:
      app: nginx-task
  strategy: {}
  template:
    metadata:
      labels:
        app: nginx-task
      name: nginx
    spec:
      containers:
      - image: nginx:1.23.0
        name: nginx
        resources: {}
status: {}
