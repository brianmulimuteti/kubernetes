apiVersion: v1
kind: Pod
metadata:
  name: mem-request-2
  namespace: mem-example
spec:
  containers:
  - name: memory-request-demo-2
    image: polinux/stress
    resources:
      requests:
        memory: "100Mi"
      limits:
        memory: "200Mi"
    command: ["stress"]
    args: ["--vm", "1", "--vm-bytes", "250M", "--vm-hang", "1"]